name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The README promises Node.js 18 or newer.
        node: [18, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: make test

  lint:
    name: Lint and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install linters
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qt6-declarative-dev-tools libxml2-utils shellcheck jq zip
      - run: make lint
        env:
          QMLFORMAT: /usr/lib/qt6/bin/qmlformat
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: tesla-monitor-plasmoid
          path: dist/tesla-monitor.plasmoid
          if-no-files-found: error
